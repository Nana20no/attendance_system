name: attendance_system
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.1.1
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10

  # State Management & DI
  flutter_bloc: ^8.1.6
  get_it: ^7.7.0

  # BLE & Permissions
  flutter_blue_plus: ^1.35.5
  flutter_ble_peripheral: ^2.1.0
  permission_handler: ^12.0.3

  # Utilities
  dartz: ^0.10.1
  equatable: ^2.0.5
  connectivity_plus: ^7.1.1
  shared_preferences: ^2.5.5
  internet_connection_checker: ^1.0.0+1
  excel: ^4.0.6
  file_picker: ^8.0.0
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  intl: ^0.20.2
  flutter_secure_storage: ^10.0.0
  uuid: ^4.5.3
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21